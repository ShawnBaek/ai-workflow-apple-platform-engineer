<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />

  <title>Notes Journal — A journal that disappears the moment you stop writing.</title>
  <meta name="description" content="A quiet journaling app for iPhone, iPad, Mac, and Apple Watch. No notifications, no streaks, no folders. Just write." />

  <!-- Open Graph -->
  <meta property="og:title" content="Notes Journal" />
  <meta property="og:description" content="A journal that disappears the moment you stop writing." />
  <meta property="og:image" content="/assets/og.png" />
  <meta property="og:url" content="https://notesjournal.app" />
  <meta property="og:type" content="website" />

  <!-- Preload removed for demo (referenced local /assets/hero-iphone.png which we don't ship binaries for). -->
  <!-- In production, restore: <link rel="preload" as="image" href="/assets/hero-iphone.png" /> -->


  <link rel="stylesheet" href="./styles/reset.css" />
  <link rel="stylesheet" href="./styles/tokens.css" />

  <!--
    Import map — lets `import { App } from 'swiftui-for-web'` work in the
    browser without a bundler or `npm install`. Resolves the bare specifier
    to the GitHub repo's entry file via jsDelivr's GitHub proxy.
    Browser support: Chrome 89+, Safari 16.4+, Firefox 108+.
  -->
  <script type="importmap">
  {
    "imports": {
      "swiftui-for-web": "https://cdn.jsdelivr.net/gh/ShawnBaek/SwiftUI-For-Web@main/src/index.js"
    }
  }
  </script>

  <!--
    <model-viewer> — Google's web component for embedding 3D models.
    Used by the `modelViewer` helper in sections/helpers.js. Pinned to a
    specific version so a CDN update can't break the site silently.
    Drop the next line if you're not using any 3D content.
  -->
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js">
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.js?v=demo5"></script>
</body>
</html>
