name: Validate skills and harness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate repository contracts
        run: python3 scripts/validate_repository.py
      - name: Run minimal contract tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  swift-tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test the additive Swift runtime
        run: swift test --package-path skills/agent-harness/verification -j 1 -Xswiftc -j1
