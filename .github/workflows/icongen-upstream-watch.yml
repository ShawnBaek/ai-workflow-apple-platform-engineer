name: Watch IconGen upstream

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: icon-composer-upstream-watch
  cancel-in-progress: false

jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out the reviewed consumer contracts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the Swift verifier
        run: swift build --package-path skills/agent-harness/verification --product apple-verify -j 1 -Xswiftc -j1
      - name: Compare the public reference-only upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          skills/agent-harness/verification/.build/debug/apple-verify companion
          --manifest skills/icon-composer/contracts/companion-upstream.json
          sync-issue
          --target-repository "$GITHUB_REPOSITORY"
